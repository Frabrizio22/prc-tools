<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics – PRC Peptides</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root[data-theme="light"] {
            --bg-primary: #FFFFFF;
            --bg-secondary: #FAFBFC;
            --bg-tertiary: #F5F7FA;
            --border: #E8EAED;
            --text-primary: #1A1D1F;
            --text-secondary: #6F7782;
            --text-tertiary: #9EA5AD;
            --accent: #0066FF;
            --accent-hover: #0052CC;
            --accent-light: #E6F0FF;
            --success: #00875A;
            --success-light: #E3FCEF;
            --danger: #DE350B;
            --danger-light: #FFEBE6;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --card-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        :root[data-theme="dark"] {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-tertiary: #334155;
            --border: #334155;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-tertiary: #64748B;
            --accent: #3B82F6;
            --accent-hover: #60A5FA;
            --success: #10B981;
            --danger: #EF4444;
            --card-shadow: rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .header {
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .header {
            background: rgba(15, 23, 42, 0.8);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .month-filter {
            padding: 0.625rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 140px;
        }

        .month-filter:hover {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        .month-filter:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.625rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.125rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--accent-light);
            transform: scale(1.05);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .refresh-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0.625rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 1px 3px rgba(0, 102, 255, 0.12);
        }

        .refresh-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.24);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .metric-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .metric-card:hover::before {
            opacity: 1;
        }

        .metric-card:hover {
            border-color: var(--accent-light);
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        .metric-label {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.75rem;
            letter-spacing: 0.025em;
        }

        .metric-value {
            font-size: 2.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .metric-growth {
            font-size: 0.8125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .metric-growth.positive {
            color: var(--success);
        }

        .metric-growth.negative {
            color: var(--danger);
        }

        .metric-growth.neutral {
            color: var(--text-tertiary);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .chart-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s;
            box-shadow: var(--card-shadow);
        }

        .chart-card:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .chart-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.75rem;
            letter-spacing: -0.02em;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        .data-table {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--card-shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            border-bottom: 1px solid var(--border);
        }

        th {
            text-align: left;
            padding: 0.75rem 1rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.025em;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: var(--bg-secondary);
            transform: scale(1.01);
        }

        .loading {
            text-align: center;
            padding: 6rem 2rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .last-updated {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.8125rem;
            margin-top: 2rem;
        }

        .btn-secondary {
            padding: 0.625rem 1.25rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        .comparison-tool {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .comparison-tool select {
            padding: 0.625rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .comparison-tool select:hover {
            border-color: var(--accent);
            background: var(--bg-primary);
        }

        .comparison-tool select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .comparison-tool label {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            display: block;
        }

        .comparison-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid;
            transition: all 0.2s ease;
        }

        .stat-card.positive {
            background: var(--success-light);
            border-color: var(--success);
        }

        .stat-card.negative {
            background: var(--danger-light);
            border-color: var(--danger);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-value.positive {
            color: var(--success);
        }

        .stat-value.negative {
            color: var(--danger);
        }

        .stat-desc {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .charts-grid {
                grid-template-columns: 1fr !important;
            }
            
            .metric-value {
                font-size: 1.75rem;
            }
            
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .month-filter {
                min-width: auto;
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>Analytics <span id="viewingMonth" style="color: var(--text-secondary); font-size: 1rem; font-weight: 500;"></span></h1>
            <div class="header-actions">
                <select id="monthFilter" class="month-filter" onchange="loadDashboard()">
                    <option value="">All Time</option>
                    <option value="2026-01">January 2026</option>
                    <option value="2026-02">February 2026</option>
                    <option value="2026-03">March 2026</option>
                    <option value="2026-04">April 2026</option>
                    <option value="2026-05">May 2026</option>
                    <option value="2026-06">June 2026</option>
                    <option value="2026-07">July 2026</option>
                    <option value="2026-08">August 2026</option>
                    <option value="2026-09">September 2026</option>
                    <option value="2026-10">October 2026</option>
                    <option value="2026-11">November 2026</option>
                    <option value="2026-12">December 2026</option>
                </select>
                <button class="theme-toggle" onclick="toggleTheme()">
                    <span id="themeIcon">☀️</span>
                </button>
                <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading analytics...</p>
        </div>

        <div id="dashboard" style="display: none;">
            <!-- Metrics Cards -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label" id="revenueLabel">Total Revenue</div>
                    <div class="metric-value" id="totalRevenue">$0</div>
                    <div class="metric-growth neutral" id="revenueGrowthLabel">All time</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-label">This Month</div>
                    <div class="metric-value" id="thisMonthRevenue">$0</div>
                    <div class="metric-growth" id="growth">
                        <span id="growthIcon">↑</span>
                        <span id="growthValue">0%</span>
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-label" id="ordersLabel">Total Orders</div>
                    <div class="metric-value" id="totalOrders">0</div>
                    <div class="metric-growth neutral" id="ordersGrowthLabel">Completed</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-label" id="avgOrderLabel">Average Order</div>
                    <div class="metric-value" id="avgOrder">$0</div>
                    <div class="metric-growth neutral">Per transaction</div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">Revenue Trend</div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-card">
                    <div class="chart-title" id="paymentChartTitle">Payment Methods</div>
                    <div class="chart-container">
                        <canvas id="paymentChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-card">
                    <div class="chart-title" id="statusChartTitle">Order Status</div>
                    <div class="chart-container">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Products Table -->
            <div class="data-table">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div class="chart-title" style="margin-bottom: 0;"><span id="productsTitle">Products</span></div>
                    <button id="toggleProducts" onclick="toggleAllProducts()" class="btn-secondary">Show All</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Product</th>
                            <th style="text-align: right;">Units Sold</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable"></tbody>
                </table>
            </div>

            <!-- Monthly Breakdown -->
            <div class="data-table">
                <div class="chart-title">Monthly Breakdown 2026</div>
                <table>
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th style="text-align: right;">Revenue</th>
                            <th style="text-align: right;">Orders</th>
                            <th style="text-align: right;">Avg Order</th>
                        </tr>
                    </thead>
                    <tbody id="monthlyTable"></tbody>
                </table>
            </div>

            <!-- Month Comparison -->
            <div class="data-table">
                <div class="chart-title">Compare Months</div>
                <div class="comparison-tool">
                    <div>
                        <label>First Month</label>
                        <select id="compareMonth1">
                            <option value="2026-01">January</option>
                            <option value="2026-02">February</option>
                            <option value="2026-03">March</option>
                            <option value="2026-04" selected>April</option>
                            <option value="2026-05">May</option>
                            <option value="2026-06">June</option>
                            <option value="2026-07">July</option>
                            <option value="2026-08">August</option>
                            <option value="2026-09">September</option>
                            <option value="2026-10">October</option>
                            <option value="2026-11">November</option>
                            <option value="2026-12">December</option>
                        </select>
                    </div>
                    <div style="padding-top: 1.5rem; color: var(--text-tertiary);">vs</div>
                    <div>
                        <label>Second Month</label>
                        <select id="compareMonth2">
                            <option value="2026-01">January</option>
                            <option value="2026-02">February</option>
                            <option value="2026-03" selected>March</option>
                            <option value="2026-04">April</option>
                            <option value="2026-05">May</option>
                            <option value="2026-06">June</option>
                            <option value="2026-07">July</option>
                            <option value="2026-08">August</option>
                            <option value="2026-09">September</option>
                            <option value="2026-10">October</option>
                            <option value="2026-11">November</option>
                            <option value="2026-12">December</option>
                        </select>
                    </div>
                    <button onclick="compareMonths()" class="refresh-btn" style="margin-top: 1.5rem;">Compare</button>
                </div>
                <div id="comparisonResults"></div>
            </div>

            <div class="last-updated" id="lastUpdated"></div>
        </div>
    </div>

    <script>
        // API ENDPOINT
        const API_URL = 'https://script.google.com/macros/s/AKfycbwUYx4SssPgid736fWsgaW0AfX8anjxfa4YRHTOCUee0n5F-KiB7Jt7qcmPRhA02cwy/exec';

        let revenueChart, paymentChart, statusChart;
        let monthlyData = [];
        let allProducts = [];
        let showAllProducts = false;

        // Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').textContent = newTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
            
            // Redraw charts with new theme colors
            if (monthlyData.length > 0) {
                updateRevenueChart(monthlyData);
                updatePaymentChart(window.paymentData);
                updateStatusChart(window.statusData);
            }
        }

        // Load saved theme (default to light)
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        async function loadDashboard() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';

            try {
                const filterMonth = document.getElementById('monthFilter').value;
                const url = filterMonth ? `${API_URL}?month=${filterMonth}` : API_URL;
                const response = await fetch(url);
                const data = await response.json();
                
                const isFiltered = !!data.filterMonth;

                // Update viewing month indicator
                const monthNames = {
                    '2026-01': 'January 2026', '2026-02': 'February 2026', '2026-03': 'March 2026',
                    '2026-04': 'April 2026', '2026-05': 'May 2026', '2026-06': 'June 2026',
                    '2026-07': 'July 2026', '2026-08': 'August 2026', '2026-09': 'September 2026',
                    '2026-10': 'October 2026', '2026-11': 'November 2026', '2026-12': 'December 2026'
                };
                
                // Update metrics
                document.getElementById('totalRevenue').textContent = '$' + parseFloat(data.metrics.totalRevenue).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                document.getElementById('thisMonthRevenue').textContent = '$' + parseFloat(data.metrics.thisMonthRevenue).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                document.getElementById('totalOrders').textContent = data.metrics.totalOrders;
                document.getElementById('avgOrder').textContent = '$' + parseFloat(data.metrics.averageOrderValue).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

                // Update metric card visibility and labels based on filter
                const monthlyBreakdownEl = document.querySelectorAll('.data-table')[1]; // Monthly Breakdown
                const comparisonEl = document.querySelectorAll('.data-table')[2]; // Month Comparison
                const growthCardEl = document.querySelectorAll('.metric-card')[1]; // This Month card
                
                if (isFiltered) {
                    // Update metric card labels for filtered view
                    document.getElementById('revenueLabel').textContent = monthNames[data.filterMonth] + ' Revenue';
                    document.getElementById('revenueGrowthLabel').textContent = 'Month total';
                    document.getElementById('ordersLabel').textContent = monthNames[data.filterMonth] + ' Orders';
                    document.getElementById('ordersGrowthLabel').textContent = 'Completed';
                    document.getElementById('avgOrderLabel').textContent = 'Average Order';
                    
                    // Hide monthly breakdown and comparison when filtering
                    monthlyBreakdownEl.style.display = 'none';
                    comparisonEl.style.display = 'none';
                    // Hide growth card when filtering
                    growthCardEl.style.display = 'none';
                } else {
                    // Reset labels for all-time view
                    document.getElementById('revenueLabel').textContent = 'Total Revenue';
                    document.getElementById('revenueGrowthLabel').textContent = 'All time';
                    document.getElementById('ordersLabel').textContent = 'Total Orders';
                    document.getElementById('ordersGrowthLabel').textContent = 'Completed';
                    document.getElementById('avgOrderLabel').textContent = 'Average Order';
                    monthlyBreakdownEl.style.display = 'block';
                    comparisonEl.style.display = 'block';
                    growthCardEl.style.display = 'block';
                    
                    // Update growth (only for all-time view)
                    const growth = data.metrics.growth;
                    const growthEl = document.getElementById('growth');
                    const growthIcon = document.getElementById('growthIcon');
                    const growthValue = document.getElementById('growthValue');
                    
                    if (growth > 0) {
                        growthEl.className = 'metric-growth positive';
                        growthIcon.textContent = '↑';
                    } else if (growth < 0) {
                        growthEl.className = 'metric-growth negative';
                        growthIcon.textContent = '↓';
                    } else {
                        growthEl.className = 'metric-growth neutral';
                        growthIcon.textContent = '→';
                    }
                    growthValue.textContent = Math.abs(growth) + '% vs last month';
                }

                // Store data globally
                monthlyData = data.revenueByMonth;
                window.paymentData = data.paymentBreakdown;
                window.statusData = data.orderStatus;
                allProducts = data.allProducts || data.topProducts;

                // Update charts and layout
                const revenueChartCard = document.querySelectorAll('.chart-card')[0];
                const chartsGrid = document.querySelector('.charts-grid');
                
                if (isFiltered) {
                    // Hide revenue trend chart when filtering (no multi-month data)
                    revenueChartCard.style.display = 'none';
                    // Adjust grid for 2 charts
                    chartsGrid.style.gridTemplateColumns = 'repeat(2, 1fr)';
                    
                    // Update chart and table titles
                    document.getElementById('productsTitle').textContent = `Top Products – ${monthNames[data.filterMonth]}`;
                    document.getElementById('paymentChartTitle').textContent = `Payment Methods – ${monthNames[data.filterMonth]}`;
                    document.getElementById('statusChartTitle').textContent = `Order Status – ${monthNames[data.filterMonth]}`;
                } else {
                    revenueChartCard.style.display = 'block';
                    chartsGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(420px, 1fr))';
                    document.getElementById('productsTitle').textContent = 'Products';
                    document.getElementById('paymentChartTitle').textContent = 'Payment Methods';
                    document.getElementById('statusChartTitle').textContent = 'Order Status';
                    updateRevenueChart(data.revenueByMonth);
                }
                
                updatePaymentChart(data.paymentBreakdown);
                updateStatusChart(data.orderStatus);

                // Update tables
                updateProductsTable();
                if (!isFiltered) {
                    updateMonthlyTable(data.revenueByMonth);
                }

                // Update timestamp
                const lastUpdated = new Date(data.lastUpdated);
                document.getElementById('lastUpdated').textContent = 'Last updated: ' + lastUpdated.toLocaleString();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').innerHTML = '<p style="color: var(--danger);">Error loading dashboard. Please try again.</p>';
                console.error('Dashboard error:', error);
            }
        }

        function getChartColors() {
            const theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                return {
                    grid: '#334155',
                    text: '#94A3B8',
                    line: '#3B82F6',
                    fill: 'rgba(59, 130, 246, 0.1)',
                    palette: ['#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#EF4444']
                };
            } else {
                return {
                    grid: '#E2E8F0',
                    text: '#64748B',
                    line: '#2563EB',
                    fill: 'rgba(37, 99, 235, 0.1)',
                    palette: ['#2563EB', '#059669', '#7C3AED', '#D97706', '#DC2626']
                };
            }
        }

        function updateRevenueChart(monthlyData) {
            const ctx = document.getElementById('revenueChart');
            const colors = getChartColors();
            
            if (revenueChart) {
                revenueChart.destroy();
            }

            const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const data = monthlyData.map(m => m.revenue);

            revenueChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue',
                        data: data,
                        borderColor: colors.line,
                        backgroundColor: colors.fill,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: colors.grid },
                            ticks: {
                                color: colors.text,
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: colors.text }
                        }
                    }
                }
            });
        }

        function updatePaymentChart(paymentData) {
            const ctx = document.getElementById('paymentChart');
            const colors = getChartColors();
            
            if (paymentChart) {
                paymentChart.destroy();
            }

            paymentChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Credit Card', 'Zelle', 'Crypto'],
                    datasets: [{
                        data: [paymentData.bankful, paymentData.zelle, paymentData.crypto],
                        backgroundColor: colors.palette.slice(0, 3),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: colors.text }
                        }
                    }
                }
            });
        }

        function updateStatusChart(statusData) {
            const ctx = document.getElementById('statusChart');
            const colors = getChartColors();
            
            if (statusChart) {
                statusChart.destroy();
            }

            statusChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Paid', 'Shipped', 'Delivered', 'Pending', 'Cancelled'],
                    datasets: [{
                        label: 'Orders',
                        data: [
                            statusData.Paid || 0,
                            statusData.Shipped || 0,
                            statusData.Delivered || 0,
                            statusData.Pending || 0,
                            statusData.Cancelled || 0
                        ],
                        backgroundColor: colors.palette,
                        borderRadius: 6,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: colors.grid },
                            ticks: {
                                color: colors.text,
                                stepSize: 1
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: colors.text }
                        }
                    }
                }
            });
        }

        function updateProductsTable() {
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = '';

            const products = showAllProducts ? allProducts : allProducts.slice(0, 10);

            products.forEach((product, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${product.name}</td>
                    <td style="text-align: right; font-weight: 600;">${product.count}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function toggleAllProducts() {
            showAllProducts = !showAllProducts;
            const btn = document.getElementById('toggleProducts');
            btn.textContent = showAllProducts ? 'Show Top 10' : 'Show All';
            updateProductsTable();
        }

        function updateMonthlyTable(months) {
            const tbody = document.getElementById('monthlyTable');
            tbody.innerHTML = '';

            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            months.forEach((monthData, index) => {
                const row = document.createElement('tr');
                const isCurrentMonth = new Date().getMonth() === index;
                const rowStyle = isCurrentMonth ? 'background: var(--bg-secondary);' : '';
                
                row.innerHTML = `
                    <td style="${rowStyle}">${monthNames[index]}</td>
                    <td style="text-align: right; font-weight: 600; ${rowStyle}">$${monthData.revenue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td style="text-align: right; ${rowStyle}">${monthData.orders}</td>
                    <td style="text-align: right; ${rowStyle}">$${monthData.avgOrder.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function compareMonths() {
            const month1Key = document.getElementById('compareMonth1').value;
            const month2Key = document.getElementById('compareMonth2').value;

            const month1 = monthlyData.find(m => m.month === month1Key);
            const month2 = monthlyData.find(m => m.month === month2Key);

            if (!month1 || !month2) return;

            const monthNames = {
                '2026-01': 'January', '2026-02': 'February', '2026-03': 'March',
                '2026-04': 'April', '2026-05': 'May', '2026-06': 'June',
                '2026-07': 'July', '2026-08': 'August', '2026-09': 'September',
                '2026-10': 'October', '2026-11': 'November', '2026-12': 'December'
            };

            const revenueDiff = month1.revenue - month2.revenue;
            const revenueGrowth = month2.revenue > 0 ? ((revenueDiff / month2.revenue) * 100).toFixed(1) : 0;
            const ordersDiff = month1.orders - month2.orders;
            const ordersGrowth = month2.orders > 0 ? ((ordersDiff / month2.orders) * 100).toFixed(1) : 0;
            const avgOrderDiff = month1.avgOrder - month2.avgOrder;

            const resultsDiv = document.getElementById('comparisonResults');
            resultsDiv.innerHTML = `
                <div class="comparison-results">
                    <div class="stat-card ${revenueDiff >= 0 ? 'positive' : 'negative'}">
                        <div class="stat-label">Revenue Difference</div>
                        <div class="stat-value ${revenueDiff >= 0 ? 'positive' : 'negative'}">
                            ${revenueDiff >= 0 ? '+' : ''}$${Math.abs(revenueDiff).toLocaleString('en-US', {minimumFractionDigits: 2})}
                        </div>
                        <div class="stat-desc">${Math.abs(revenueGrowth)}% ${revenueDiff >= 0 ? 'higher' : 'lower'}</div>
                    </div>
                    
                    <div class="stat-card ${ordersDiff >= 0 ? 'positive' : 'negative'}">
                        <div class="stat-label">Order Difference</div>
                        <div class="stat-value ${ordersDiff >= 0 ? 'positive' : 'negative'}">
                            ${ordersDiff >= 0 ? '+' : ''}${ordersDiff}
                        </div>
                        <div class="stat-desc">${Math.abs(ordersGrowth)}% ${ordersDiff >= 0 ? 'more' : 'fewer'} orders</div>
                    </div>
                    
                    <div class="stat-card ${avgOrderDiff >= 0 ? 'positive' : 'negative'}">
                        <div class="stat-label">Avg Order Difference</div>
                        <div class="stat-value ${avgOrderDiff >= 0 ? 'positive' : 'negative'}">
                            ${avgOrderDiff >= 0 ? '+' : ''}$${Math.abs(avgOrderDiff).toLocaleString('en-US', {minimumFractionDigits: 2})}
                        </div>
                        <div class="stat-desc">per order</div>
                    </div>
                </div>
                
                <table style="margin-top: 1.5rem;">
                    <thead>
                        <tr>
                            <th></th>
                            <th style="text-align: right;">${monthNames[month1Key]}</th>
                            <th style="text-align: right;">${monthNames[month2Key]}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Revenue</td>
                            <td style="text-align: right; font-weight: 600;">$${month1.revenue.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                            <td style="text-align: right; font-weight: 600;">$${month2.revenue.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        </tr>
                        <tr>
                            <td>Orders</td>
                            <td style="text-align: right;">${month1.orders}</td>
                            <td style="text-align: right;">${month2.orders}</td>
                        </tr>
                        <tr>
                            <td>Avg Order</td>
                            <td style="text-align: right;">$${month1.avgOrder.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                            <td style="text-align: right;">$${month2.avgOrder.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        // Load dashboard on page load
        loadDashboard();

        // Auto-refresh every 5 minutes
        setInterval(loadDashboard, 5 * 60 * 1000);
    </script>
</body>
</html>
